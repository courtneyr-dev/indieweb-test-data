name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: XML is well-formed
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('*.xml')):
              ET.parse(f)
              print(f'ok {f}')
          PY

      - name: Committed XML matches the generator
        run: |
          python3 bin/generate.py > /tmp/generic.xml
          python3 bin/generate.py --layer extended > /tmp/extended.xml
          python3 bin/generate.py --no-matrix > /tmp/small.xml
          diff -q /tmp/generic.xml  indieweb-test-data.xml
          diff -q /tmp/extended.xml indieweb-test-data-extended.xml
          diff -q /tmp/small.xml    indieweb-test-data-small.xml
          echo "generated output matches what is committed"

      - name: Coverage assertions
        run: |
          python3 - <<'PY'
          import csv, re
          fmts  = [r['slug'] for r in csv.DictReader(open('data/formats.csv'))]
          kinds = [r['slug'] for r in csv.DictReader(open('data/kinds.csv'))]
          xfn   = [r['value'] for r in csv.DictReader(open('data/xfn.csv'))]
          x = open('indieweb-test-data.xml').read()
          missing = []
          for k in kinds:
              if f'nicename="{k}"' not in x: missing.append(f'kind {k}')
          for f in fmts:
              if f != 'standard' and f'post-format-{f}' not in x: missing.append(f'format {f}')
          for v in xfn:
              if f'rel="{v}"' not in x and f'{v} ' not in x: missing.append(f'xfn {v}')
          assert not missing, f'missing from corpus: {missing}'
          expected = len(fmts) * len(kinds)
          got = len(re.findall(r'matrix-', x))
          assert got >= expected, f'matrix has {got} entries, expected at least {expected}'
          print(f'{len(fmts)} formats, {len(kinds)} kinds, {len(xfn)} XFN values, {expected}-cell matrix — all present')
          PY

      - name: Visibility, media, and date cases
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from xml.etree import ElementTree as ET

          def posts(root):
              return {item.findtext('{*}post_name'): item for item in root.findall('channel/item')}

          generic = posts(ET.parse('indieweb-test-data-small.xml').getroot())
          extended = posts(ET.parse('indieweb-test-data-extended.xml').getroot())
          for kind in ('listen', 'recipe'):
              for corpus in (generic, extended):
                  public = corpus[f'edge-{kind}-public']
                  locked = corpus[f'edge-{kind}-locked']
                  assert public.findtext('{*}post_password') == ''
                  assert locked.findtext('{*}post_password') == 'fixture-unlock'
                  assert public.findtext('{*}encoded') == locked.findtext('{*}encoded')

          media = {item.findtext('{*}post_id'): item for item in extended.values()
                   if item.findtext('{*}post_type') == 'attachment'}
          for image_id in ('3001', '3002'):
              item = media[image_id]
              filename = item.findtext('{*}attachment_url').rsplit('/', 1)[1]
              assert (Path('media') / filename).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              assert item.findtext('{http://wordpress.org/export/1.2/excerpt/}encoded')
              assert item.findtext('{*}postmeta/{*}meta_key') == '_wp_attachment_image_alt'
              assert item.findtext('{*}postmeta/{*}meta_value')

          for slug in ('edge-listen-public', 'edge-listen-locked', 'edge-recipe-public',
                       'edge-recipe-locked', 'edge-listen-native-card'):
              meta = {entry.findtext('{*}meta_key'): entry.findtext('{*}meta_value')
                      for entry in extended[slug].findall('{*}postmeta')}
              assert meta['_thumbnail_id'] in media
          assert 'wp:post-kinds-indieweb/listen-card' in extended['edge-listen-native-card'].findtext('{*}encoded')
          assert 'wp:post-kinds-indieweb/listen-card' not in extended['edge-listen-public'].findtext('{*}encoded')
          assert 'missing-cover.png' in extended['edge-listen-missing-cover'].findtext('{*}encoded')

          command = ['python3', 'bin/generate.py', '--no-matrix', '--as-of', '2027-01-01']
          generated = subprocess.check_output(command)
          assert generated == subprocess.check_output(command)
          dates = posts(ET.fromstring(generated))
          before, after = (dates[f'edge-date-{side}-midnight'] for side in ('before', 'after'))
          assert before.findtext('{*}post_date') == '2026-12-31 23:30:00'
          assert before.findtext('{*}post_date_gmt') == '2027-01-01 04:30:00'
          assert after.findtext('{*}post_date') == '2027-01-01 00:30:00'
          assert after.findtext('{*}post_date_gmt') == '2027-01-01 05:30:00'
          assert dates['edge-date-scheduled'].findtext('{*}status') == 'future'
          assert dates['edge-date-scheduled'].findtext('{*}post_date') == '2027-01-02 09:00:00'
          assert dates['edge-date-anniversary'].findtext('{*}post_date').startswith('2026-01-01')
          print('Visibility pairs, bundled media, PKIW cards, and the repeated year boundary passed')
          PY

      - name: Case manifests, expectations, and exports
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))

          cases = {}
          for path in Path('cases').rglob('*.json'):
              if path.name.endswith('.expected.json'):
                  assert path.with_name(path.name.removesuffix('.expected.json') + '.json').is_file()
                  continue
              case = json.loads(path.read_text(encoding='utf-8'))
              expected = json.loads(path.with_suffix('.expected.json').read_text(encoding='utf-8'))
              assert case['id'] == expected['id'] == path.stem
              assert case['id'] not in cases
              assert expected['roles'] and expected['operations'] and expected['assertions']
              html = path.with_suffix('.html').read_text(encoding='utf-8')
              cases[case['id']] = (case, html)
          formats = {
              case['format'] or 'standard' for case, _ in cases.values()
              if case['id'].startswith('format-')
          }
          expected_formats = {
              'standard', 'aside', 'audio', 'chat', 'gallery',
              'image', 'link', 'quote', 'status', 'video',
          }
          assert formats == expected_formats, f'post format round-trip cases: {expected_formats - formats}'

          prefix = 'https://example.test/wp-content/uploads/indieweb-fixtures/'
          for path in Path('.').glob('*.xml'):
              channel = ET.parse(path).getroot().find('channel')
              assert channel.findtext('{*}wxr_version') == '1.2'
              items = channel.findall('item')
              by_slug = {item.findtext('{*}post_name'): item for item in items}
              ids = {item.findtext('{*}post_id') for item in items}
              assert len(ids) == len(by_slug) == len(items)
              for case, html in cases.values():
                  post = by_slug[case['id']]
                  assert post.findtext('{*}post_id') == str(case['postId'])
                  assert post.findtext('{*}encoded') == html
                  terms = [term.get('nicename') for term in post.findall('category')
                           if term.get('domain') == 'post_format']
                  assert terms == (['post-format-' + case['format']] if case['format'] else [])
                  for media in case.get('attachments', []):
                      source = Path('media') / media['file']
                      attachment = by_slug[source.stem]
                      assert source.stat().st_size > 0
                      assert attachment.findtext('{*}post_id') == str(media['id'])
                      assert attachment.findtext('{*}post_type') == 'attachment'
                      assert attachment.findtext('{*}attachment_url') == prefix + media['file']
                      assert prefix + media['file'] in html
          print(f'{len(cases)} expectation IDs and required fields checked; case manifests and HTML match all three WXR exports')
          PY
